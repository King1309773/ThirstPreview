buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'

version = '1.1.0'
group = 'dev.rlcraftceaddons'
archivesBaseName = 'thirstpreview'
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
minecraft { mappings channel: 'stable', version: '39-1.12' }
repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    implementation fg.deobf('local:SimpleDifficulty-1.12.2:0.3.9')
    testImplementation 'junit:junit:4.12'
}
test {
    def packRules = file(project.findProperty('packRules') ?: '../../config/simpledifficulty/consumableThirst.json')
    if (packRules.isFile()) {
        systemProperty 'thirstpreview.packRules', packRules.absolutePath
    }
    if (project.hasProperty('gravestoneJar')) {
        systemProperty 'thirstpreview.gravestoneJar', file(project.property('gravestoneJar')).absolutePath
    }
}
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar.finalizedBy('reobfJar')
